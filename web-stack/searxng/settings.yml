use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave
      - mojeek
      - wikipedia
server:
  limiter: false
  image_proxy: false
general:
  enable_metrics: false
search:
  formats:
    - html
    - json
outgoing:
  request_timeout: 10
  using_tor_proxy: true
  extra_proxy_timeout: 10
  proxies:
    all://:
